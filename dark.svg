<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Dwi Junior — profile.sh --live">
<defs>
  <!-- Animated Cyber Gradient Border -->
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#A78BFA;#10B981;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#10B981;#22D3EE;#A78BFA" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#22D3EE;#A78BFA;#10B981" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>

  <!-- Laser Scanline Gradient -->
  <linearGradient id="scannerGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>

  <!-- Portrait Matrix Gradient -->
  <linearGradient id="cyberMesh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="60%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#0284C7"/>
  </linearGradient>

  <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A101F"/>
    <stop offset="100%" stop-color="#070B16"/>
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <clipPath id="winClip">
    <rect x="2" y="2" width="1176" height="606" rx="16"/>
  </clipPath>
  
  <clipPath id="avatarClip">
    <rect x="36" y="84" width="400" height="492" rx="10"/>
  </clipPath>
</defs>

<!-- Window Container -->
